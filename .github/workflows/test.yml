name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4

      - name: shellcheck
        run: shellcheck scripts/*.sh tests/*.sh

      - name: unit tests
        run: bash tests/run.sh

      - name: actionlint
        run: actionlint
